name: Fetch Daily Racecards

on:
  schedule:
    # daily at 06:30 AM ET (11:30 UTC, runs before predictions at 07:00 AM ET)
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch racecards for (YYYY-MM-DD). Will also fetch for the following day. If omitted, uses today and tomorrow (ET).'
        required: false

concurrency:
  group: daily-racecards
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false  # Disable LFS to avoid bandwidth quota

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine dates
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "today=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
            echo "tomorrow=$(TZ=America/New_York date -d "${{ github.event.inputs.date }} +1 day" +%F)" >> $GITHUB_OUTPUT
          else
            echo "today=$(TZ=America/New_York date +%F)" >> $GITHUB_OUTPUT
            echo "tomorrow=$(TZ=America/New_York date -d '+1 day' +%F)" >> $GITHUB_OUTPUT
          fi

      # Racing Post returns HTTP 406 to GitHub-hosted runners.  Use the
      # authenticated API in CI rather than attempting to scrape a source
      # that deliberately blocks this execution environment.
      - name: Fetch racecards for today
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "Fetching racecards for ${{ steps.dates.outputs.today }}"
          python scripts/fetch_racecards_api.py --date ${{ steps.dates.outputs.today }}

      - name: Fetch racecards for tomorrow
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          # The Free racecards endpoint may enforce a stricter limit than the
          # account-wide API rate. Keep the two daily requests well apart.
          sleep 30
          echo "Fetching racecards for ${{ steps.dates.outputs.tomorrow }}"
          python scripts/fetch_racecards_api.py --date ${{ steps.dates.outputs.tomorrow }}

      - name: Commit fetched racecards
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add data/raw/racecards_${{ steps.dates.outputs.today }}.json || true
          git add data/raw/racecards_${{ steps.dates.outputs.tomorrow }}.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: fetch racecards for ${{ steps.dates.outputs.today }} and ${{ steps.dates.outputs.tomorrow }} [skip ci]" || true
            git push
          fi
