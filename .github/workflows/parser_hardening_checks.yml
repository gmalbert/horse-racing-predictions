name: Parser Hardening Checks

on:
  pull_request:
    paths:
      - 'scripts/parse_t1_*_tracksite.py'
      - 'scripts/backtest_walk_forward.py'
      - 'tests/test_t1_parser_hardening.py'
      - 'tests/test_backtest_walk_forward_odds.py'
      - 'tests/fixtures/t1_*.json'
      - '.github/workflows/parser_hardening_checks.yml'
  push:
    branches:
      - main
      - fix/odds-errors
    paths:
      - 'scripts/parse_t1_*_tracksite.py'
      - 'scripts/backtest_walk_forward.py'
      - 'tests/test_t1_parser_hardening.py'
      - 'tests/test_backtest_walk_forward_odds.py'
      - 'tests/fixtures/t1_*.json'
      - '.github/workflows/parser_hardening_checks.yml'
  workflow_dispatch:

jobs:
  parser-hardening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run parser and odds diagnostics tests
        run: |
          python -m pytest tests/test_t1_parser_hardening.py tests/test_backtest_walk_forward_odds.py -q
