name: Grid feed regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - run: python -m unittest discover -s tests -p 'test_grid_*.py' -v
