name: Morning Email & Result Capture

on:
  schedule:
    # Morning email at 07:00 UTC (7 AM UK time, after predictions generated)
    - cron: '0 7 * * *'
    # Evening result capture at 22:00 UTC (after UK racing finishes)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run: email, results, or both'
        required: false
        default: 'both'
      date:
        description: 'Date for results capture (YYYY-MM-DD, default: yesterday)'
        required: false

jobs:
  morning-email:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 7 * * *' || github.event.inputs.action == 'email' || github.event.inputs.action == 'both' || github.event.inputs.action == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send morning email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python scripts/send_morning_email.py
        continue-on-error: true  # Don't fail the workflow if email fails

  result-capture:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 22 * * *' || github.event.inputs.action == 'results' || github.event.inputs.action == 'both' || github.event.inputs.action == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture race results
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/capture_race_results.py --date ${{ github.event.inputs.date }} --update-history
          else
            python scripts/capture_race_results.py --update-history
          fi

      - name: Commit updated predictions and results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/processed/predictions_*.csv data/processed/betting_history.csv data/raw/results_*.json
          git diff --staged --quiet || git commit -m "chore: update predictions with race results [skip ci]"
          git push
        continue-on-error: true  # Don't fail if no changes to commit
