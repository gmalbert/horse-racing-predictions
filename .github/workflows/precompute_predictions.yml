name: Precompute Daily Predictions

on:
  schedule:
    # daily at 07:00 AM ET (12:00 UTC, runs after racecards pulled at 06:30 AM ET)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate predictions for (YYYY-MM-DD). Will also generate for the following day. If omitted, uses today and tomorrow (ET).'
        required: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false  # Disable LFS to avoid bandwidth quota

      - name: Cache historical race data
        uses: actions/cache@v4
        with:
          path: |
            data/processed/all_gb_races.parquet
            data/processed/all_gb_races_cleaned.parquet
            data/processed/race_scores.parquet
            data/processed/race_scores_with_betting_tiers.parquet
            data/processed/race_scores_with_all_features_no_leakage.parquet
            data/processed/race_scores_connections_v2.parquet
          key: horse-racing-data-v2
          restore-keys: |
            horse-racing-data-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine dates
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "today=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
            echo "tomorrow=$(TZ=America/New_York date -d "${{ github.event.inputs.date }} +1 day" +%F)" >> $GITHUB_OUTPUT
          else
            echo "today=$(TZ=America/New_York date +%F)" >> $GITHUB_OUTPUT
            echo "tomorrow=$(TZ=America/New_York date -d '+1 day' +%F)" >> $GITHUB_OUTPUT
          fi

      - name: Run prediction script
        id: predict
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -e
          echo "Generating predictions for ${{ steps.dates.outputs.today }}"
          python scripts/predict_todays_races.py --date ${{ steps.dates.outputs.today }}
          echo "Generating predictions for ${{ steps.dates.outputs.tomorrow }}"
          python scripts/predict_todays_races.py --date ${{ steps.dates.outputs.tomorrow }}

      # ── Odds scraping (graceful degradation: continue-on-error so a blocked
      #    scrape never fails the whole predictions pipeline) ─────────────────
      #
      #    RP scraper uses headless=False (bypasses bot detection).  On the
      #    GitHub-hosted Ubuntu runner there is no display, so we run under
      #    xvfb-run which provides a virtual framebuffer — Chrome sees a real
      #    screen and behaves identically to a local desktop run.

      - name: Install Playwright browser + virtual display
        if: steps.predict.outcome == 'success'
        run: |
          sudo apt-get install -y xvfb
          playwright install chromium --with-deps
        continue-on-error: true

      - name: Scrape Racing Post odds — today
        if: steps.predict.outcome == 'success'
        run: |
          echo "Scraping RP odds for ${{ steps.dates.outputs.today }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            python scripts/scrape_rp_odds.py --date ${{ steps.dates.outputs.today }}
        continue-on-error: true

      - name: Scrape Racing Post odds — tomorrow
        if: steps.predict.outcome == 'success'
        run: |
          echo "Scraping RP odds for ${{ steps.dates.outputs.tomorrow }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            python scripts/scrape_rp_odds.py --date ${{ steps.dates.outputs.tomorrow }}
        continue-on-error: true

      - name: Scrape ATR multi-bookmaker odds — today + tomorrow
        if: steps.predict.outcome == 'success'
        timeout-minutes: 6
        run: |
          echo "Scraping ATR odds for ${{ steps.dates.outputs.today }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            python scripts/scrape_atr_odds.py --date ${{ steps.dates.outputs.today }}
          echo "Scraping ATR odds for ${{ steps.dates.outputs.tomorrow }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            python scripts/scrape_atr_odds.py --date ${{ steps.dates.outputs.tomorrow }}
        continue-on-error: true

      - name: Merge odds into predictions — today
        if: steps.predict.outcome == 'success'
        run: |
          python scripts/merge_scraped_odds.py --date ${{ steps.dates.outputs.today }}
        continue-on-error: true

      - name: Merge odds into predictions — tomorrow
        if: steps.predict.outcome == 'success'
        run: |
          python scripts/merge_scraped_odds.py --date ${{ steps.dates.outputs.tomorrow }}
        continue-on-error: true

      - name: Update bankroll history
        if: steps.predict.outcome == 'success'
        continue-on-error: true
        run: |
          echo "💰 Updating bankroll history for ${{ steps.dates.outputs.today }}..."
          python scripts/rl_bankroll_manager.py --date ${{ steps.dates.outputs.today }} --update-history

      # ──────────────────────────────────────────────────────────────────────

      - name: Commit generated predictions
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add data/processed/predictions_${{ steps.dates.outputs.today }}.* || true
          git add data/processed/predictions_${{ steps.dates.outputs.tomorrow }}.* || true
          # Also commit raw odds files (useful for debugging / auditing)
          git add "data/raw/rp_odds_${{ steps.dates.outputs.today }}.csv" || true
          git add "data/raw/rp_odds_${{ steps.dates.outputs.tomorrow }}.csv" || true
          git add "data/raw/atr_odds_best_${{ steps.dates.outputs.today }}.csv" || true
          git add "data/raw/atr_odds_best_${{ steps.dates.outputs.tomorrow }}.csv" || true
          git add data/processed/bankroll_state.json data/processed/betting_history.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: precompute predictions + odds for ${{ steps.dates.outputs.today }} and ${{ steps.dates.outputs.tomorrow }} [skip ci]" || true
            git push
          fi
