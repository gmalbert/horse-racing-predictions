name: Export Web Data (React)

# Publishes the precomputed JSON artifacts consumed by the React frontend
# (web/frontend/public/data). Runs after the daily prediction jobs so the
# Cloudflare Pages site always serves fresh precomputed values.

on:
  workflow_dispatch:
  schedule:
    # Daily fallback; workflow_run also refreshes after prediction jobs finish.
    - cron: "0 9 * * *"
  workflow_run:
    workflows: ["Precompute Daily Predictions", "US Ingestion Guardrails"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: export-web-data
  cancel-in-progress: true

jobs:
  export:
    # PR validation has no published outputs on main. Export only successful
    # production prediction runs, or an explicit scheduled/manual refresh.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-export-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install pandas numpy pyarrow

      - name: Export precomputed JSON
        run: python scripts/export_web_data.py --history 14

      - name: Export current GB and US grid picks
        run: python scripts/export_best_bets.py

      - name: Validate exported data
        run: python scripts/validate_web_data.py

      - name: Commit exported data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/frontend/public/data data_files/best_bets_today.json
          if git diff --staged --quiet; then
            echo "No exported data changes"
          else
            git commit -m "chore(web): refresh precomputed JSON for React frontend" -m "## Data refresh
          - Export prediction cards, fixture calendars, historical statistics, and model summaries.
          - Validate JSON integrity and coverage against the available pipeline outputs.
          - Preserve source dates so historical data remains clearly labeled in the React app.
          - Rebase on main before pushing; keep synchronization failures fatal."
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
