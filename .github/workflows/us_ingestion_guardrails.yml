name: US Ingestion Guardrails

on:
  schedule:
    # Daily at 06:15 UTC
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to validate (YYYY-MM-DD). Defaults to today ET.'
        required: false

jobs:
  validate-us-ingestion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine dates
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "today=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
            echo "tomorrow=$(TZ=America/New_York date -d "${{ github.event.inputs.date }} +1 day" +%F)" >> $GITHUB_OUTPUT
          else
            echo "today=$(TZ=America/New_York date +%F)" >> $GITHUB_OUTPUT
            echo "tomorrow=$(TZ=America/New_York date -d '+1 day' +%F)" >> $GITHUB_OUTPUT
          fi

      - name: Build US all-sources racecards — today
        run: |
          echo "Building US racecards and source report for ${{ steps.dates.outputs.today }}"
          python scripts/fetch_us_all_sources.py --date ${{ steps.dates.outputs.today }}

      - name: Build US all-sources racecards — tomorrow
        run: |
          echo "Building US racecards and source report for ${{ steps.dates.outputs.tomorrow }}"
          python scripts/fetch_us_all_sources.py --date ${{ steps.dates.outputs.tomorrow }}

      - name: Validate US ingestion guardrails
        run: |
          python scripts/validate_us_ingestion.py \
            --date ${{ steps.dates.outputs.today }} \
            --min-total-races 8 \
            --min-total-runners 50 \
            --min-ml-odds-coverage 0.50 \
            --lookback-days 14 \
            --min-drift-ratio 0.50 \
            --allow-empty-racecards

      - name: Audit US odds coverage
        if: always()
        run: |
          python scripts/audit_us_odds_coverage.py --date ${{ steps.dates.outputs.today }}

      - name: Generate US predictions — today
        if: always()
        run: |
          python scripts/predict_us_races.py --date ${{ steps.dates.outputs.today }}

      - name: Generate US predictions — tomorrow
        if: always()
        run: |
          python scripts/predict_us_races.py --date ${{ steps.dates.outputs.tomorrow }}

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-ingestion-validation-${{ steps.dates.outputs.today }}
          path: |
            data/raw/us_racecards_${{ steps.dates.outputs.today }}.json
            data/raw/us_racecards_${{ steps.dates.outputs.tomorrow }}.json
            data/raw/us_source_report_${{ steps.dates.outputs.today }}.json
            data/raw/us_source_report_${{ steps.dates.outputs.tomorrow }}.json
            data/processed/us_ingestion_validation_${{ steps.dates.outputs.today }}.json
            data/processed/us_ingestion_validation_${{ steps.dates.outputs.today }}.md
            data/processed/us_odds_coverage_audit_${{ steps.dates.outputs.today }}.json
            data/processed/us_odds_coverage_audit_${{ steps.dates.outputs.today }}.md
            data/processed/us_predictions_${{ steps.dates.outputs.today }}.csv
            data/processed/us_predictions_${{ steps.dates.outputs.tomorrow }}.csv
          if-no-files-found: warn

      - name: Commit US ingestion reports + predictions
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add data/raw/us_racecards_${{ steps.dates.outputs.today }}.json || true
          git add data/raw/us_racecards_${{ steps.dates.outputs.tomorrow }}.json || true
          git add data/raw/us_source_report_${{ steps.dates.outputs.today }}.json || true
          git add data/raw/us_source_report_${{ steps.dates.outputs.tomorrow }}.json || true
          git add data/processed/us_ingestion_validation_${{ steps.dates.outputs.today }}.json || true
          git add data/processed/us_ingestion_validation_${{ steps.dates.outputs.today }}.md || true
          git add data/processed/us_odds_coverage_audit_${{ steps.dates.outputs.today }}.json || true
          git add data/processed/us_odds_coverage_audit_${{ steps.dates.outputs.today }}.md || true
          git add data/processed/us_predictions_${{ steps.dates.outputs.today }}.csv || true
          git add data/processed/us_predictions_${{ steps.dates.outputs.tomorrow }}.csv || true
          if git diff --staged --quiet; then
            echo "No US ingestion report changes to commit"
          else
            git commit -m "chore: US ingestion + predictions for ${{ steps.dates.outputs.today }} and ${{ steps.dates.outputs.tomorrow }} [skip ci]" || true
            git pull --rebase origin main || echo "No remote changes to rebase"
            git push
          fi
