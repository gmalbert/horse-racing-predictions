name: Weekly Model Training & Scoring

on:
  schedule:
    # Every Monday at 02:00 ET (07:00 UTC, after weekend racing)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining even if no new data (true/false)'
        required: false
        default: 'false'

jobs:
  weekly-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false  # Disable LFS to avoid bandwidth quota

      - name: Cache derived race scores
        uses: actions/cache@v4
        with:
          path: |
            data/processed/race_scores.parquet
            data/processed/race_scores_with_betting_tiers.parquet
            data/processed/race_scores_with_all_features_no_leakage.parquet
            data/processed/race_scores_connections_v2.parquet
          # Stable key so the same entry is refreshed each run (avoids 7-day expiry).
          # all_gb_races.parquet and all_gb_races_cleaned.parquet are committed to
          # git as regular objects, so they are always present after checkout.
          key: horse-racing-scores-v3
          restore-keys: |
            horse-racing-scores-v3
            horse-racing-data-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check for new race data
        id: check_data
        run: |
          # Check if we have new race data since last run
          LAST_RUN_FILE=".last_weekly_run"
          CURRENT_DATE=$(date -u +%F)

          if [ -f "$LAST_RUN_FILE" ]; then
            LAST_RUN=$(cat "$LAST_RUN_FILE")
            echo "Last run: $LAST_RUN"

            # Check for new racecard files since last run
            NEW_RACECARDS=$(find data/raw -name "racecards_*.json" -newer "$LAST_RUN_FILE" 2>/dev/null | wc -l)
            echo "New racecards since last run: $NEW_RACECARDS"

            if [ "$NEW_RACECARDS" -gt 0 ] || [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
              echo "has_new_data=true" >> $GITHUB_OUTPUT
              echo "✅ Found new race data or force retrain requested"
            else
              echo "has_new_data=false" >> $GITHUB_OUTPUT
              echo "⏭️ No new race data found, skipping training"
            fi
          else
            echo "has_new_data=true" >> $GITHUB_OUTPUT
            echo "🔄 First run or missing timestamp, proceeding with training"
          fi

      - name: Validate cached data
        id: validate_cache
        if: steps.check_data.outputs.has_new_data == 'true'
        run: |
          echo "Validating cached data..."
          
          # Function to validate a parquet file
          validate_parquet() {
            local file=$1
            local name=$2
            if [ -f "$file" ]; then
              if python -c "import pandas as pd; df = pd.read_parquet('$file'); print(f'Rows: {len(df):,}')" 2>/dev/null; then
                echo "✅ $name is valid"
                return 0
              else
                echo "❌ $name is corrupted (Parquet magic bytes error)"
                return 1
              fi
            else
              echo "⚠️  $name does not exist"
              return 1
            fi
          }
          
          # Check for required base data file — this file is committed to git
          # as a regular object (~43MB), so it must always be present after checkout.
          if ! validate_parquet "data/processed/all_gb_races.parquet" "Raw historical data"; then
            echo ""
            echo "╔════════════════════════════════════════════════════════════╗"
            echo "║  ❌ FATAL: all_gb_races.parquet missing from repository    ║"
            echo "╚════════════════════════════════════════════════════════════╝"
            echo ""
            echo "This file is tracked in git and should always be present."
            echo "Re-push the parquet locally: git add data/processed/all_gb_races.parquet"
            echo ""
            echo "has_data=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Validate cleaned data (can be regenerated)
          if ! validate_parquet "data/processed/all_gb_races_cleaned.parquet" "Cleaned data"; then
            echo "🗑️  Removing corrupted cleaned data..."
            rm -f data/processed/all_gb_races_cleaned.parquet
            echo "🔄 Regenerating cleaned data from Phase 1..."
            python scripts/phase1_data_cleaning.py
          fi
          
          echo "has_data=true" >> $GITHUB_OUTPUT

      - name: Score historical races (Phase 2)
        id: score_races
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🔢 Running Phase 2: Race profitability scoring..."
          python scripts/phase2_score_races.py

      # --- Feature engineering pipeline (order is critical — each step feeds the next) ---
      # race_scores.parquet
      #   → pedigree_no_leakage → race_scores_with_pedigree_no_leakage.parquet
      #     → going_pref        → race_scores_going_pref.parquet
      #       → or_context      → race_scores_or_context.parquet
      #         → enhanced_form → race_scores_enhanced_form.parquet
      #           → connections → race_scores_connections_v2.parquet
      #             → pedigree  → race_scores_pedigree.parquet

      - name: Add pedigree features (no-leakage baseline)
        id: pedigree_noleak
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.score_races.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🧬 Running pedigree features (no-leakage, reads race_scores.parquet)..."
          python scripts/add_pedigree_features_no_leakage.py

      - name: Add going preference features
        id: going_pref
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.pedigree_noleak.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🌦️  Running going preference features (6 new features)..."
          python scripts/add_going_preference_features.py

      - name: Add OR context features
        id: or_context
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.going_pref.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "📈 Running OR context features (13 new features)..."
          python scripts/add_or_context_features.py

      - name: Verify no leakage
        id: verify_leakage
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.or_context.outcome == 'success'
        run: |
          echo "🛡️ Verifying no-leakage constraints..."
          python scripts/verify_no_leakage.py

      - name: Add enhanced form features (V2.1)
        id: enhanced_form
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.or_context.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "📊 Running enhanced form features (6 new features)..."
          python scripts/add_enhanced_form_features.py

      - name: Add connections form features (V2.1)
        id: connections_v2
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.enhanced_form.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🔗 Running connections form V2 features (13 new features)..."
          python scripts/add_connections_form_v2.py

      - name: Add pedigree features
        id: pedigree_full
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.connections_v2.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🧬 Running pedigree features (12 new features, reads connections_v2)..."
          python scripts/add_pedigree_features.py

      - name: Apply betting strategy tiers
        id: betting_strategy
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.score_races.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🎯 Running betting strategy classification..."
          python scripts/apply_betting_strategy.py

      - name: Retrain ML model (Phase 3)
        id: retrain
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.pedigree_full.outcome == 'success' && steps.verify_leakage.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "🤖 Running Phase 3: ML model retraining..."
          python scripts/phase3_build_horse_model.py

      - name: Score upcoming fixtures
        id: score_fixtures
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.retrain.outcome == 'success'
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          echo "📅 Running fixture scoring..."
          python scripts/score_fixture_calendar.py

      - name: Add weather features (offline)
        id: weather_features
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.retrain.outcome == 'success'
        continue-on-error: true
        run: |
          echo "🌦️  Adding weather/going features (offline mode)..."
          python scripts/add_weather_features.py --offline

      - name: Build engineered dataset
        id: build_engineered
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.retrain.outcome == 'success'
        run: |
          echo "🔧 Building race_scores_engineered.parquet (all 75 features)..."
          python scripts/build_engineered_dataset.py

      - name: Validate feature contract
        id: validate_contract
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.build_engineered.outcome == 'success'
        run: |
          echo "🧩 Validating model feature contract..."
          python scripts/validate_feature_contract.py \
            --feature-file models/feature_columns.txt \
            --dataset data/processed/race_scores_engineered.parquet \
            --dataset data/processed/race_scores_with_all_features_no_leakage.parquet \
            --dataset data/processed/race_scores_connections_v2.parquet \
            --max-missing-ratio 0.05

      - name: Train stacked ensemble model
        id: train_ensemble
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.retrain.outcome == 'success'
        continue-on-error: true
        run: |
          echo "🧪 Training stacked ensemble (XGBoost + LightGBM + ExtraTrees)..."
          python scripts/ensemble_model.py

      - name: Run walk-forward backtest
        id: backtest
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.retrain.outcome == 'success' && steps.validate_contract.outcome == 'success'
        run: |
          echo "📊 Running walk-forward backtest (6 folds)..."
          python scripts/backtest_walk_forward.py --folds 6

      - name: Enforce backtest quality gate
        id: backtest_gate
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.backtest.outcome == 'success'
        run: |
          echo "🚦 Enforcing backtest quality thresholds..."
          python scripts/enforce_backtest_gate.py \
            --results-file data/processed/backtest_results.json \
            --min-folds 4 \
            --min-mean-auc 0.58 \
            --min-mean-top1 0.10 \
            --max-mean-level-drawdown 500

      - name: Update last run timestamp
        id: update_timestamp
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.score_fixtures.outcome == 'success' && steps.backtest_gate.outcome == 'success'
        run: |
          echo "📝 Updating last run timestamp..."
          date -u +%F > .last_weekly_run
          echo "Last run timestamp updated to $(cat .last_weekly_run)"

      - name: Commit model updates
        if: steps.check_data.outputs.has_new_data == 'true' && steps.validate_cache.outputs.has_data == 'true' && steps.update_timestamp.outcome == 'success'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Add updated model artifacts and data
          git add models/ data/processed/race_scores.parquet data/processed/race_scores_with_betting_tiers.parquet data/processed/race_scores_with_all_features_no_leakage.parquet data/processed/race_scores_connections_v2.parquet data/processed/race_scores_engineered.parquet data/processed/scored_fixtures_calendar.csv .last_weekly_run || true

          if git diff --staged --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "chore: weekly model training and race scoring [skip ci]" || true
            git push
            echo "✅ Model updates committed and pushed"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.validate_cache.outputs.has_data }}" != "true" ]; then
            echo "❌ Weekly training failed: all_gb_races.parquet is missing from git checkout"
            echo ""
            echo "This file is committed to the repo as a regular git object."
            echo "Ensure it was not accidentally removed from the repository."
          elif [ "${{ steps.check_data.outputs.has_new_data }}" = "true" ]; then
            echo "✅ Weekly training completed successfully"
            echo "   - Race scores updated"
            echo "   - Enhanced form features added (6 new)"
            echo "   - Connections form V2 features added (13 new)"
            echo "   - Pedigree features added (12 new)"
            echo "   - Going preference features added (6 new)"
            echo "   - OR context features added (13 new)"
            echo "   - Betting tiers applied"
            echo "   - ML model retrained (120 features)"
            echo "   - Fixtures rescored"
            echo "   - Changes committed to repository"
          else
            echo "⏭️ Weekly training skipped (no new data)"
          fi