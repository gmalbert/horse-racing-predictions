name: Fetch US TVG Historical Results

on:
  schedule:
    # nightly at 05:00 UTC (before daily racecard fetch and weekly training)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days back from today to fetch (default: 7)'
        required: false
        default: '7'

jobs:
  fetch-us-tvg-results:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch US TVG historical results
        run: |
          DAYS=${{ github.event.inputs.days || '7' }}
          echo "Fetching last $DAYS days of US TVG historical results..."
          python scripts/fetch_tvg_results.py --days "$DAYS"

      - name: Commit fetched TVG results and updated history
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -f data/raw/tvg_results_*.json
          git add data/processed/us_races_cleaned.parquet
          if git diff --staged --quiet; then
            echo "No new TVG result files and history to commit"
          else
            git commit -m "chore: fetch US TVG historical result data [skip ci]" -m "## Data refresh
          - Persist validated pipeline outputs and source diagnostics.
          - Retain updated history and predictions in the repository for subsequent checkouts.
          - Stop publication if the commit or remote synchronization fails."
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
