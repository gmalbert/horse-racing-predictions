name: equine-edge

services:
  api:
    build: ./web/backend
    restart: unless-stopped
    environment:
      HRP_DATA_DIR: /data/processed
      HRP_RAW_DIR: /data/raw
      HRP_STATE_DIR: /state
      HRP_CORS_ORIGINS: http://localhost:${HRP_WEB_PORT:-8080}
    volumes:
      - ./data:/data:ro
      - betting-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 15s

  web:
    build: ./web/frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HRP_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 6s
      retries: 5

volumes:
  betting-state:
